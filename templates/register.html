
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0, 255, 127, 0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(0, 255, 127, 0.08), transparent 30%),
                #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: rgba(15, 15, 15, 0.96);
            border: 1px solid rgba(0, 255, 127, 0.18);
            border-radius: 18px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55),
                0 0 30px rgba(0, 255, 127, 0.06);
            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #00ff7f, #00c853);
            color: #050505;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 8px 25px rgba(0, 255, 127, 0.2);
        }

        h2 {
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #999999;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #cccccc;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #00ff7f;
            font-size: 16px;
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #0b0b0b;
            border: 1px solid #2b2b2b;
            border-radius: 10px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #666666;
        }

        input:hover {
            border-color: #3a3a3a;
        }

        input:focus {
            border-color: #00ff7f;
            background: #101010;
            box-shadow: 0 0 0 3px rgba(0, 255, 127, 0.1);
        }

        .form-errors {
            margin: 5px 0 18px;
            padding: 12px 14px;
            background: rgba(255, 60, 60, 0.08);
            border: 1px solid rgba(255, 60, 60, 0.25);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            overflow-wrap: break-word;
        }

        .form-errors ul {
            margin: 0;
            padding-left: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00ff7f, #00c853);
            color: #050505;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 127, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #222222;
            margin: 25px 0 20px;
        }

        .link {
            color: #888888;
            font-size: 14px;
        }

        .link a {
            color: #00ff7f;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .link a:hover {
            color: #66ffad;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
                border-radius: 15px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">+</div>

        <h2>Create Account</h2>
        <p class="subtitle">Register to get started with your account</p>

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label for="username">Username</label>

                <div class="input-wrapper">
                    <span>👤</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="password1">Password</label>

                <div class="input-wrapper">
                    <span>🔒</span>
                    <input
                        type="password"
                        id="password1"
                        name="password1"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="password2">Confirm Password</label>

                <div class="input-wrapper">
                    <span>🔐</span>
                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {{ form.errors }}
                </div>
            {% endif %}

            <button type="submit">
                Create Account
            </button>
        </form>

        <div class="divider"></div>

        <div class="link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>

</body>
</html>
