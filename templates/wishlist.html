<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0a0f1c, #05070d);
      color: white;
      font-family: 'DM Sans', sans-serif;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,255,255,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px cyan;
    }

    .neon-text {
      color: cyan;
      text-shadow: 0 0 10px cyan;
    }
  </style>
</head>

<body class="p-10">
         <!-- 🔙 TOP NAV -->
<div class="flex justify-between items-center mb-6">

  <!-- Home Button -->
  <a href="{% url 'home' %}" 
     class="px-5 py-2 rounded-lg font-semibold border border-cyan-400 text-cyan-300 hover:bg-cyan-400 hover:text-black transition shadow-lg hover:shadow-cyan-500/50">
     ⬅ Home
  </a>

</div>

  <h1 class="text-4xl font-bold neon-text mb-8">❤️ Your Wishlist</h1>

  {% if items %}
  <div class="grid md:grid-cols-4 gap-6">

    {% for item in items %}
    <div class="card rounded-xl p-4">

      <img src="https://image.tmdb.org/t/p/w500{{ item.poster_path }}"
           class="rounded-lg mb-3">

      <h2 class="font-semibold text-lg">{{ item.title }}</h2>

      <!-- Remove Button -->
      <form method="POST" action="{% url 'toggle_wishlist' item.movie_id %}">
        {% csrf_token %}
        <input type="hidden" name="title" value="{{ item.title }}">
        <input type="hidden" name="poster" value="{{ item.poster_path }}">

        <button class="mt-3 w-full bg-red-500 hover:bg-red-600 px-3 py-2 rounded">
          Remove
        </button>
      </form>

    </div>
    {% endfor %}

  </div>

  {% else %}
  <p class="text-gray-400">No movies in wishlist 😢</p>
  {% endif %}

</body>
</html>
